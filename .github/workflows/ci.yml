# Проверки при каждом пуше: тесты прав доступа на настоящем PostgreSQL (PGlite) и сборка без ошибок TypeScript.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db
      - run: npm run build
